name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: mishka-group/mishka_cms/.github/workflows/mishka-ci.yml@ci-v1
    with:
      credence-task: mishka_pay.credence
      # The demo shop is built against this checkout, so a change to the library that breaks it
      # fails here.
      extra-checks: |
        cd examples/shop
        mix deps.get
        MIX_ENV=test mix compile --warnings-as-errors
        MIX_ENV=test mix format --check-formatted
      sobelow: true
      # Postgres for the Ash layer's tests, its schema made from the test resources, and Stripe's
      # own mock server for the :stripe_mock tests; the run fails if it is not up.
      postgres: true
      pre-test: |
        mix ash.codegen ci
        docker run -d -p 12111:12111 stripe/stripe-mock:latest
        until curl -s localhost:12111 > /dev/null; do sleep 1; done
        echo "STRIPE_MOCK_REQUIRED=1" >> "$GITHUB_ENV"
