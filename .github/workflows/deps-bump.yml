name: Deps bump
on:
  repository_dispatch:
    types: [upstream-released]
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  bump:
    uses: mishka-group/mishka_cms/.github/workflows/mishka-deps-bump.yml@ci-v1
    with:
      package: ${{ github.event.client_payload.package }}
      version: ${{ github.event.client_payload.version }}
    secrets: inherit
